<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f5f5f0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      padding: 2.5rem;
    }

    .maintenance-message {
      color: #1a1a1a;
      font-size: 1.5rem;
      line-height: 1.3;
      max-width: 90vw;
      word-wrap: break-word;
      text-align: center;
    }

    @media (max-width: 480px) {
      .maintenance-message {
        font-size: 1.25rem;
      }

      body {
        padding: 2rem 1.25rem;
      }
    }

    @media (max-width: 320px) {
      .maintenance-message {
        font-size: 1.15rem;
      }

      body {
        padding: 1.5rem;
      }
    }
  </style>
</head>

<body>
  <div class="maintenance-message">
    Maintenance mode. Come back soon!
  </div>
</body>

</html>
